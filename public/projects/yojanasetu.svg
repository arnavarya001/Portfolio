<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1376 768" width="1376" height="768">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a12" />
      <stop offset="45%" stop-color="#091322" />
      <stop offset="100%" stop-color="#04070d" />
    </linearGradient>

    <!-- Radial Cyan Halos -->
    <radialGradient id="haloRight" cx="72%" cy="46%" r="42%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.22" />
      <stop offset="45%" stop-color="#0284c7" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#04070d" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="haloLeft" cx="22%" cy="38%" r="48%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.14" />
      <stop offset="60%" stop-color="#091322" stop-opacity="0" />
    </radialGradient>

    <!-- Neon Glow Filters -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur1" />
      <feGaussianBlur stdDeviation="12" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="cyanGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#00f0ff" flood-opacity="0.65" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#00e5ff" flood-opacity="0.4" />
    </filter>

    <!-- Chart Fill Gradient -->
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- 1. Background Fill -->
  <rect width="1376" height="768" fill="url(#bgGrad)" />
  <rect width="1376" height="768" fill="url(#haloRight)" />
  <rect width="1376" height="768" fill="url(#haloLeft)" />

  <!-- 2. Circuit Board Tracks & Solder Nodes -->
  <g stroke="#00f0ff" stroke-opacity="0.16" stroke-width="1.5" fill="none">
    <path d="M 450,110 L 620,110 L 660,150 L 850,150" />
    <path d="M 520,380 L 620,380 L 670,440 L 780,440" />
    <path d="M 580,660 L 680,660 L 720,610 L 920,610" />
    <path d="M 780,40 L 840,40 L 880,90 L 1150,90" />
    <path d="M 1200,680 L 1260,680 L 1290,640 L 1340,640" />
  </g>
  <g fill="#00f0ff" fill-opacity="0.4">
    <circle cx="620" cy="110" r="3" />
    <circle cx="660" cy="150" r="3" />
    <circle cx="620" cy="380" r="3" />
    <circle cx="670" cy="440" r="3" />
    <circle cx="680" cy="660" r="3" />
    <circle cx="720" cy="610" r="3" />
  </g>

  <!-- 3. Monospace Code Lines in Background -->
  <g font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" fill-opacity="0.14">
    <text x="1100" y="80" fill="#38bdf8">const service = require('./engine');</text>
    <text x="1100" y="104" fill="#a78bfa">const router = express.Router();</text>
    <text x="1100" y="128" fill="#34d399">router.get('/telemetry', async (req, res) =&gt; &#123;</text>
    <text x="1120" y="152" fill="#38bdf8">  const stream = await service.getMetrics();</text>
    <text x="1120" y="176" fill="#fbbf24">  return res.status(200).json(stream);</text>
    <text x="1100" y="200" fill="#34d399">&#125;);</text>
    <text x="1100" y="234" fill="#94a3b8">// Vector state verified: CSAT 99.4%</text>
  </g>

  <!-- 4. Top Minimal Brand Shell -->
  <g transform="translate(90, 70)">
    <circle cx="8" cy="8" r="7" fill="#00f0ff" fill-opacity="0.8" />
    <text x="26" y="13" fill="#64748b" font-family="'Inter', sans-serif" font-weight="700" font-size="14" letter-spacing="0.5">PLATFORM / ARCHITECTURE</text>
  </g>

  <!-- 5. Big Left Typography -->
  <g transform="translate(90, 260)">
    <text x="0" y="0" fill="#ffffff" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="58" letter-spacing="1">YOJANA SETU</text>
    <text x="0" y="74" fill="#38bdf8" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="50" letter-spacing="1.5" filter="url(#cyanGlow)">CIVIC SCHEME FINDER</text>
  </g>

  <!-- 6. Bottom Left Three Tech Badges -->
  <!-- Badge 1 -->
  <g>
    <circle cx="160" cy="520" r="50" fill="#07101c" stroke="#00f0ff" stroke-width="3" filter="url(#neonGlow)" />
    <circle cx="125" cy="485" r="14" fill="#050a12" stroke="#00f0ff" stroke-width="2" />
    <text x="125" y="490" fill="#00f0ff" font-family="'Inter', sans-serif" font-weight="800" font-size="13" text-anchor="middle">1</text>
    
        <!-- React Icon -->
        <g transform="translate(160, 520) scale(0.85)">
          <ellipse rx="26" ry="10" fill="none" stroke="#00d8ff" stroke-width="2.4" />
          <ellipse rx="26" ry="10" fill="none" stroke="#00d8ff" stroke-width="2.4" transform="rotate(60)" />
          <ellipse rx="26" ry="10" fill="none" stroke="#00d8ff" stroke-width="2.4" transform="rotate(120)" />
          <circle r="4.5" fill="#00d8ff" />
        </g>
        
    <rect x="95" y="586" width="130" height="36" rx="18" fill="#060d17" stroke="#00f0ff" stroke-width="2.5" filter="url(#softGlow)" />
    <text x="160" y="609" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="800" font-size="13" letter-spacing="1" text-anchor="middle">REACT</text>
  </g>

  <!-- Badge 2 -->
  <g>
    <circle cx="320" cy="520" r="50" fill="#07101c" stroke="#00f0ff" stroke-width="3" filter="url(#neonGlow)" />
    <circle cx="285" cy="485" r="14" fill="#050a12" stroke="#00f0ff" stroke-width="2" />
    <text x="285" y="490" fill="#00f0ff" font-family="'Inter', sans-serif" font-weight="800" font-size="13" text-anchor="middle">2</text>
    
        <!-- TypeScript Icon -->
        <g transform="translate(320, 520) scale(0.9)">
          <rect x="-22" y="-22" width="44" height="44" rx="8" fill="#3178c6"/>
          <text x="-4" y="11" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="900" font-size="20">TS</text>
        </g>
        
    <rect x="255" y="586" width="130" height="36" rx="18" fill="#060d17" stroke="#00f0ff" stroke-width="2.5" filter="url(#softGlow)" />
    <text x="320" y="609" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="800" font-size="13" letter-spacing="1" text-anchor="middle">TYPESCRIPT</text>
  </g>

  <!-- Badge 3 -->
  <g>
    <circle cx="480" cy="520" r="50" fill="#07101c" stroke="#00f0ff" stroke-width="3" filter="url(#neonGlow)" />
    <circle cx="445" cy="485" r="14" fill="#050a12" stroke="#00f0ff" stroke-width="2" />
    <text x="445" y="490" fill="#00f0ff" font-family="'Inter', sans-serif" font-weight="800" font-size="13" text-anchor="middle">3</text>
    
        <!-- Tailwind Icon -->
        <g transform="translate(480, 520) scale(0.85)">
          <path d="M -22,0 C -18,-14 -10,-14 -6,-8 C -2,-2 2,0 8,0 C 14,0 20,-6 24,-12 C 22,2 14,2 10,-4 C 6,-10 2,-12 -4,-12 C -12,-12 -18,-2 -22,0 Z" fill="#38bdf8"/>
          <path d="M -26,12 C -22,-2 -14,-2 -10,4 C -6,10 -2,12 4,12 C 10,12 16,6 20,0 C 18,14 10,14 6,8 C 2,2 -2,0 -8,0 C -16,0 -22,10 -26,12 Z" fill="#38bdf8"/>
        </g>
        
    <rect x="415" y="586" width="130" height="36" rx="18" fill="#060d17" stroke="#00f0ff" stroke-width="2.5" filter="url(#softGlow)" />
    <text x="480" y="609" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="800" font-size="13" letter-spacing="1" text-anchor="middle">TAILWIND</text>
  </g>

  <!-- 7. Right Side HUD Radar Arcs & Rings -->
  <g transform="translate(1010, 385)">
    <circle cx="0" cy="0" r="280" fill="none" stroke="#00f0ff" stroke-opacity="0.22" stroke-dasharray="10 14" stroke-width="1.5" />
    <circle cx="0" cy="0" r="315" fill="none" stroke="#38bdf8" stroke-opacity="0.18" stroke-width="1.2" />
    <path d="M -315,0 A 315 315 0 0 1 0,-315" fill="none" stroke="#00f0ff" stroke-opacity="0.45" stroke-width="2.5" />
    <path d="M 0,315 A 315 315 0 0 1 315,0" fill="none" stroke="#00f0ff" stroke-opacity="0.45" stroke-width="2.5" />
    <line x1="-280" y1="0" x2="-265" y2="0" stroke="#00f0ff" stroke-width="2" stroke-opacity="0.5" />
    <line x1="265" y1="0" x2="280" y2="0" stroke="#00f0ff" stroke-width="2" stroke-opacity="0.5" />
    <line x1="0" y1="-280" x2="0" y2="-265" stroke="#00f0ff" stroke-width="2" stroke-opacity="0.5" />
    <line x1="0" y1="265" x2="0" y2="280" stroke="#00f0ff" stroke-width="2" stroke-opacity="0.5" />
  </g>

  <!-- 8. Right Side 3D Tilted Tablet Screen -->
  <g transform="translate(1010, 385) rotate(-6.5) skewY(2.8) scale(1, 0.96)">
    <!-- Outer Tablet Body with Neon Blue Rim -->
    <rect x="-268" y="-178" width="536" height="356" rx="22" fill="#08101a" stroke="#00f0ff" stroke-width="4" filter="url(#neonGlow)" />
    <!-- Inner Dark Glass Bezel -->
    <rect x="-258" y="-168" width="516" height="336" rx="16" fill="#060c16" stroke="#1e293b" stroke-width="1.5" />

    <!-- Screen Navigation Bar -->
    <g transform="translate(0, -140)">
      <path d="M -236,2 L -242,-3 L -236,-8" stroke="#38bdf8" stroke-width="2" fill="none" stroke-linecap="round" />
      <text x="-222" y="1" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="700" font-size="14">Civic Navigator</text>

      <rect x="65" y="-12" width="86" height="22" rx="6" fill="#0c1726" stroke="#0284c7" stroke-width="1.2" />
      <text x="108" y="3" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="9" font-weight="600" text-anchor="middle">All Analytics ▾</text>

      <circle cx="178" cy="-1" r="9" fill="#0c1726" stroke="#38bdf8" stroke-width="1" />
      <circle cx="183" cy="-5" r="2.5" fill="#f43f5e" />
      <circle cx="212" cy="-1" r="11" fill="#0284c7" />
      <circle cx="212" cy="-3" r="4.5" fill="#ffffff" />
      <path d="M 205,7 C 205,3 219,3 219,7 Z" fill="#ffffff" />
    </g>

    <!-- Top Left Wave Chart Card -->
    <g transform="translate(-244, -120)">
      <rect width="310" height="152" rx="10" fill="#091322" stroke="#16263d" stroke-width="1.4" />
      <text x="14" y="22" fill="#64748b" font-family="'Inter', sans-serif" font-weight="700" font-size="10" letter-spacing="1">CITIZEN MATCHING FLUX</text>
      
      <!-- Chart Grid Lines -->
      <line x1="14" y1="52" x2="296" y2="52" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4" />
      <line x1="14" y1="88" x2="296" y2="88" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4" />
      <line x1="14" y1="124" x2="296" y2="124" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4" />

      <!-- Spline Wave Area Fill -->
      <path d="M 14,105 C 70,55 120,90 170,30 C 210,12 250,60 296,25 L 296,140 L 14,140 Z" fill="url(#chartGrad)" />
      <!-- Spline Wave Line -->
      <path d="M 14,105 C 70,55 120,90 170,30 C 210,12 250,60 296,25" fill="none" stroke="#00f0ff" stroke-width="2.8" stroke-linecap="round" />
      <!-- Peak Dot -->
      <circle cx="210" cy="12" r="4.5" fill="#00f0ff" filter="url(#softGlow)" />
      <circle cx="210" cy="12" r="8" fill="none" stroke="#00f0ff" stroke-width="1.2" stroke-opacity="0.6" />
    </g>

    <!-- Top Right Circular CSAT Ring Card -->
    <g transform="translate(80, -120)">
      <rect width="164" height="152" rx="10" fill="#091322" stroke="#16263d" stroke-width="1.4" />
      
      <g transform="translate(82, 54)">
        <circle cx="0" cy="0" r="36" fill="none" stroke="#132235" stroke-width="7.5" />
        <circle cx="0" cy="0" r="36" fill="none" stroke="#00f0ff" stroke-width="7.5" stroke-linecap="round" stroke-dasharray="225 250" transform="rotate(-90)" filter="url(#softGlow)" />
        <text x="0" y="2" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="900" font-size="16" text-anchor="middle">95%</text>
        <text x="0" y="15" fill="#64748b" font-family="'Inter', sans-serif" font-weight="700" font-size="8" letter-spacing="0.5" text-anchor="middle">GRANTED</text>
      </g>

      <g transform="translate(20, 118)">
        <circle cx="6" cy="4" r="3" fill="#38bdf8" />
        <text x="16" y="7" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="9">Enrolled: 720</text>
        <circle cx="90" cy="4" r="3" fill="#34d399" />
        <text x="100" y="7" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="9">Pending: 38</text>
      </g>
    </g>

    <!-- Bottom Left Metric Summary Card -->
    <g transform="translate(-244, 44)">
      <rect width="310" height="98" rx="10" fill="#091322" stroke="#16263d" stroke-width="1.4" />
      
      <g transform="translate(20, 24)">
        <text x="0" y="0" fill="#64748b" font-family="'Inter', sans-serif" font-size="9" font-weight="700" letter-spacing="0.5">Schemes</text>
        <text x="0" y="26" fill="#ffffff" font-family="'Inter', sans-serif" font-size="22" font-weight="900">140+</text>
      </g>
      <g transform="translate(116, 24)">
        <text x="0" y="0" fill="#64748b" font-family="'Inter', sans-serif" font-size="9" font-weight="700" letter-spacing="0.5">Verified</text>
        <text x="0" y="26" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="22" font-weight="900">890</text>
      </g>
      <g transform="translate(210, 24)">
        <text x="0" y="0" fill="#64748b" font-family="'Inter', sans-serif" font-size="9" font-weight="700" letter-spacing="0.5">Latency</text>
        <text x="0" y="26" fill="#34d399" font-family="'Inter', sans-serif" font-size="22" font-weight="900">85ms</text>
      </g>

      <rect x="20" y="70" width="270" height="4" rx="2" fill="#132235" />
      <rect x="20" y="70" width="210" height="4" rx="2" fill="#00f0ff" />
    </g>

    <!-- Bottom Right Status Card -->
    <g transform="translate(80, 44)">
      <rect width="164" height="98" rx="10" fill="#091322" stroke="#16263d" stroke-width="1.4" />
      <text x="14" y="20" fill="#64748b" font-family="'Inter', sans-serif" font-weight="700" font-size="9" letter-spacing="0.5">Current Status</text>
      
      <g transform="translate(82, 58)">
        <circle cx="0" cy="0" r="22" fill="none" stroke="#132235" stroke-width="5" />
        <circle cx="0" cy="0" r="22" fill="none" stroke="#00f0ff" stroke-width="5" stroke-linecap="round" stroke-dasharray="115 140" transform="rotate(-90)" />
        <text x="0" y="3" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="800" font-size="11" text-anchor="middle">98%</text>
        <text x="0" y="12" fill="#64748b" font-family="'Inter', sans-serif" font-weight="700" font-size="6" text-anchor="middle">ELIGIBLE</text>
      </g>
    </g>
  </g>
</svg>