<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1376 768" width="1376" height="768">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a12" />
      <stop offset="45%" stop-color="#0a1224" />
      <stop offset="100%" stop-color="#04070e" />
    </linearGradient>

    <!-- Radial Cyan Halos -->
    <radialGradient id="haloRight" cx="72%" cy="46%" r="44%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.22" />
      <stop offset="45%" stop-color="#3b82f6" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#04070e" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="haloLeft" cx="22%" cy="38%" r="48%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.16" />
      <stop offset="60%" stop-color="#091322" stop-opacity="0" />
    </radialGradient>

    <!-- Neon Glow Filters -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur1" />
      <feGaussianBlur stdDeviation="12" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="cyanGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#00f0ff" flood-opacity="0.65" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#00e5ff" flood-opacity="0.4" />
    </filter>

    <!-- Button Gradient -->
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>

  <!-- 1. Background Fill -->
  <rect width="1376" height="768" fill="url(#bgGrad)" />
  <rect width="1376" height="768" fill="url(#haloRight)" />
  <rect width="1376" height="768" fill="url(#haloLeft)" />

  <!-- 2. Circuit Board Tracks & Solder Nodes -->
  <g stroke="#00f0ff" stroke-opacity="0.16" stroke-width="1.5" fill="none">
    <path d="M 450,110 L 620,110 L 660,150 L 850,150" />
    <path d="M 520,380 L 620,380 L 670,440 L 780,440" />
    <path d="M 580,660 L 680,660 L 720,610 L 920,610" />
    <path d="M 780,40 L 840,40 L 880,90 L 1150,90" />
    <path d="M 1200,680 L 1260,680 L 1290,640 L 1340,640" />
  </g>
  <g fill="#00f0ff" fill-opacity="0.4">
    <circle cx="620" cy="110" r="3" />
    <circle cx="660" cy="150" r="3" />
    <circle cx="620" cy="380" r="3" />
    <circle cx="670" cy="440" r="3" />
    <circle cx="680" cy="660" r="3" />
    <circle cx="720" cy="610" r="3" />
  </g>

  <!-- 3. Monospace Code Lines in Background -->
  <g font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" fill-opacity="0.16">
    <text x="1050" y="70" fill="#38bdf8">chrome.tabs.query({ active: true }, async ([tab]) =&gt; &#123;</text>
    <text x="1070" y="94" fill="#a78bfa">  const repo = parseGitHubUrl(tab.url);</text>
    <text x="1070" y="118" fill="#34d399">  const tree = await fetchRepoTree(repo.owner, repo.name);</text>
    <text x="1070" y="142" fill="#38bdf8">  const readme = await generateGroundedMarkdown(tree);</text>
    <text x="1070" y="166" fill="#fbbf24">  await commitToGitHub(repo, 'README.md', readme);</text>
    <text x="1050" y="190" fill="#34d399">&#125;);</text>
    <text x="1050" y="220" fill="#94a3b8">// Manifest V3: Direct Commit Pipeline Active</text>
  </g>

  <!-- 4. Top Minimal Brand Shell -->
  <g transform="translate(90, 70)">
    <circle cx="8" cy="8" r="7" fill="#00f0ff" fill-opacity="0.8" />
    <text x="26" y="13" fill="#64748b" font-family="'Inter', sans-serif" font-weight="700" font-size="14" letter-spacing="0.5">DEV TOOLS / CHROME EXTENSION</text>
  </g>

  <!-- 5. Big Left Typography -->
  <g transform="translate(90, 260)">
    <text x="0" y="0" fill="#ffffff" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="58" letter-spacing="1">REPOREAD AI</text>
    <text x="0" y="74" fill="#00f0ff" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="48" letter-spacing="1.5" filter="url(#cyanGlow)">1-CLICK README UPDATER</text>
  </g>

  <!-- 6. Bottom Left Three Tech Badges -->
  <!-- Badge 1: React -->
  <g>
    <circle cx="160" cy="520" r="50" fill="#07101c" stroke="#00f0ff" stroke-width="3" filter="url(#neonGlow)" />
    <circle cx="125" cy="485" r="14" fill="#050a12" stroke="#00f0ff" stroke-width="2" />
    <text x="125" y="490" fill="#00f0ff" font-family="'Inter', sans-serif" font-weight="800" font-size="13" text-anchor="middle">1</text>
    <g transform="translate(160, 520) scale(0.9)">
      <ellipse rx="22" ry="8" fill="none" stroke="#61dafb" stroke-width="2" />
      <ellipse rx="22" ry="8" fill="none" stroke="#61dafb" stroke-width="2" transform="rotate(60)" />
      <ellipse rx="22" ry="8" fill="none" stroke="#61dafb" stroke-width="2" transform="rotate(120)" />
      <circle r="4" fill="#61dafb" />
    </g>
    <rect x="95" y="586" width="130" height="36" rx="18" fill="#060d17" stroke="#00f0ff" stroke-width="2.5" filter="url(#softGlow)" />
    <text x="160" y="609" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="800" font-size="13" letter-spacing="1" text-anchor="middle">REACT 18</text>
  </g>

  <!-- Badge 2: Chrome Extension (Manifest V3) -->
  <g>
    <circle cx="320" cy="520" r="50" fill="#07101c" stroke="#00f0ff" stroke-width="3" filter="url(#neonGlow)" />
    <circle cx="285" cy="485" r="14" fill="#050a12" stroke="#00f0ff" stroke-width="2" />
    <text x="285" y="490" fill="#00f0ff" font-family="'Inter', sans-serif" font-weight="800" font-size="13" text-anchor="middle">2</text>
    <g transform="translate(320, 520) scale(0.9)">
      <!-- Extension Icon Symbol -->
      <path d="M-16,-10 L-6,-10 C-6,-16 6,-16 6,-10 L16,-10 L16,0 C22,0 22,12 16,12 L16,18 L6,18 L6,14 C0,14 0,22 -6,22 L-16,22 Z" fill="#0ea5e9" stroke="#38bdf8" stroke-width="1.5" />
    </g>
    <rect x="255" y="586" width="130" height="36" rx="18" fill="#060d17" stroke="#00f0ff" stroke-width="2.5" filter="url(#softGlow)" />
    <text x="320" y="609" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="800" font-size="13" letter-spacing="1" text-anchor="middle">MANIFEST V3</text>
  </g>

  <!-- Badge 3: GitHub API -->
  <g>
    <circle cx="480" cy="520" r="50" fill="#07101c" stroke="#00f0ff" stroke-width="3" filter="url(#neonGlow)" />
    <circle cx="445" cy="485" r="14" fill="#050a12" stroke="#00f0ff" stroke-width="2" />
    <text x="445" y="490" fill="#00f0ff" font-family="'Inter', sans-serif" font-weight="800" font-size="13" text-anchor="middle">3</text>
    <g transform="translate(480, 520) scale(0.85)">
      <circle cx="-12" cy="12" r="5" fill="#a855f7"/>
      <circle cx="-12" cy="-12" r="5" fill="#a855f7"/>
      <circle cx="12" cy="-2" r="5" fill="#a855f7"/>
      <line x1="-12" y1="-7" x2="-12" y2="7" stroke="#a855f7" stroke-width="3"/>
      <path d="M -12,2 C -6,2 4,2 8,-2" stroke="#a855f7" stroke-width="3" fill="none"/>
    </g>
    <rect x="415" y="586" width="130" height="36" rx="18" fill="#060d17" stroke="#00f0ff" stroke-width="2.5" filter="url(#softGlow)" />
    <text x="480" y="609" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="800" font-size="13" letter-spacing="1" text-anchor="middle">GITHUB API</text>
  </g>

  <!-- 7. Right Side HUD Radar Arcs & Rings -->
  <g transform="translate(1010, 385)">
    <circle cx="0" cy="0" r="280" fill="none" stroke="#00f0ff" stroke-opacity="0.22" stroke-dasharray="10 14" stroke-width="1.5" />
    <circle cx="0" cy="0" r="315" fill="none" stroke="#38bdf8" stroke-opacity="0.18" stroke-width="1.2" />
    <path d="M -315,0 A 315 315 0 0 1 0,-315" fill="none" stroke="#00f0ff" stroke-opacity="0.45" stroke-width="2.5" />
    <path d="M 0,315 A 315 315 0 0 1 315,0" fill="none" stroke="#00f0ff" stroke-opacity="0.45" stroke-width="2.5" />
    <line x1="-280" y1="0" x2="-265" y2="0" stroke="#00f0ff" stroke-width="2" stroke-opacity="0.5" />
    <line x1="265" y1="0" x2="280" y2="0" stroke="#00f0ff" stroke-width="2" stroke-opacity="0.5" />
    <line x1="0" y1="-280" x2="0" y2="-265" stroke="#00f0ff" stroke-width="2" stroke-opacity="0.5" />
    <line x1="0" y1="265" x2="0" y2="280" stroke="#00f0ff" stroke-width="2" stroke-opacity="0.5" />
  </g>

  <!-- 8. Right Side Floating Chrome Extension Popup Window -->
  <g transform="translate(1010, 385) rotate(-3.5) skewY(1.4)">
    <!-- Outer Popup Frame with Neon Cyan Rim -->
    <rect x="-240" y="-210" width="480" height="420" rx="20" fill="#070d17" stroke="#00f0ff" stroke-width="3" filter="url(#neonGlow)" />
    <!-- Inner Dark Glass Surface -->
    <rect x="-232" y="-202" width="464" height="404" rx="14" fill="#091322" stroke="#1e293b" stroke-width="1.5" />

    <!-- Extension Header Bar -->
    <g transform="translate(0, -170)">
      <rect x="-215" y="-18" width="430" height="36" rx="8" fill="#0f1c30" stroke="#334155" stroke-width="1" />
      <text x="-200" y="5" fill="#00f0ff" font-family="'Inter', sans-serif" font-weight="900" font-size="14">⚡ RepoRead AI</text>
      <circle cx="85" cy="0" r="4" fill="#22c55e" filter="url(#softGlow)" />
      <text x="96" y="4" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Active Tab</text>
      <rect x="165" y="-10" width="40" height="20" rx="4" fill="#1e293b" />
      <text x="185" y="4" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">v1.0</text>
    </g>

    <!-- Detected Target Repo Card -->
    <g transform="translate(0, -100)">
      <rect x="-215" y="-12" width="430" height="74" rx="10" fill="#0a1628" stroke="#0284c7" stroke-width="1.2" />
      <text x="-195" y="14" fill="#64748b" font-family="'Inter', sans-serif" font-size="10" font-weight="700" letter-spacing="1">CURRENT GITHUB REPOSITORY</text>
      <text x="-195" y="38" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="800">arnavarya001 / Mobile_Shop</text>
      <rect x="120" y="18" width="80" height="22" rx="11" fill="#065f46" stroke="#10b981" stroke-width="1" />
      <text x="160" y="33" fill="#6ee7b7" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="middle">● main</text>
    </g>

    <!-- Detected Tech Stack Badges Bar -->
    <g transform="translate(0, -18)">
      <text x="-210" y="-4" fill="#64748b" font-family="'Inter', sans-serif" font-size="10" font-weight="700" letter-spacing="0.5">INSPECTED TECH STACK</text>
      <g transform="translate(-215, 8)">
        <rect x="0" y="0" width="68" height="24" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
        <text x="34" y="16" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="middle">React 18</text>

        <rect x="76" y="0" width="66" height="24" rx="6" fill="#1e293b" stroke="#34d399" stroke-width="1" />
        <text x="109" y="16" fill="#34d399" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="middle">Node.js</text>

        <rect x="150" y="0" width="70" height="24" rx="6" fill="#1e293b" stroke="#a78bfa" stroke-width="1" />
        <text x="185" y="16" fill="#a78bfa" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="middle">Express</text>

        <rect x="228" y="0" width="88" height="24" rx="6" fill="#1e293b" stroke="#fbbf24" stroke-width="1" />
        <text x="272" y="16" fill="#fbbf24" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="middle">Drizzle ORM</text>

        <rect x="324" y="0" width="60" height="24" rx="6" fill="#1e293b" stroke="#f472b6" stroke-width="1" />
        <text x="354" y="16" fill="#f472b6" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="middle">Vite 6</text>
      </g>
    </g>

    <!-- Big Action Button -->
    <g transform="translate(0, 52)">
      <rect x="-215" y="0" width="430" height="46" rx="10" fill="url(#btnGrad)" filter="url(#cyanGlow)" />
      <text x="0" y="28" fill="#050a12" font-family="'Inter', sans-serif" font-weight="900" font-size="15" letter-spacing="0.5" text-anchor="middle">✨ Auto-Generate &amp; Update README</text>
    </g>

    <!-- Bottom Pipeline Status Feed -->
    <g transform="translate(0, 126)">
      <rect x="-215" y="0" width="430" height="64" rx="8" fill="#07101c" stroke="#1e293b" stroke-width="1" />
      <circle cx="-195" cy="18" r="4" fill="#10b981" />
      <text x="-182" y="22" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11">AST scan complete · 48 files inspected</text>
      <circle cx="-195" cy="42" r="4" fill="#38bdf8" />
      <text x="-182" y="46" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">Direct commit pushed · SHA 8f3b2e9 (main)</text>
    </g>
  </g>
</svg>

